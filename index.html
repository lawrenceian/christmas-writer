<!DOCTYPE html>
<html>
<head>
    <title>Christmas Quick Write Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Roboto Slab', serif;
            text-align: center;
            background: linear-gradient(to bottom, #000428, #004e92);
            margin: 0;
            padding: 0;
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            transition: background 0.5s;
        }

        /* --- CHRISTMAS LIGHTS --- */
        .light-rope {
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            position: absolute;
            z-index: 2000;
            margin: -15px 0 0 0;
            padding: 0;
            pointer-events: none;
            width: 100%;
        }
        .light {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin: 20px;
            background: #f00;
            box-shadow: 0px 5px 20px 2px #f00;
            animation: flash 2s infinite alternate;
        }
        .light:nth-child(2n+1) { background: #0f0; box-shadow: 0px 5px 24px 3px #0f0; animation-duration: 1.5s; }
        .light:nth-child(4n+2) { background: #f1c40f; box-shadow: 0px 5px 24px 3px #f1c40f; animation-duration: 2.2s; }
        @keyframes flash { 0% { opacity: 0.5; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); } }

        /* --- SNOWFALL & CONFETTI --- */
        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1em;
            opacity: 0.8;
            pointer-events: none;
            z-index: 0;
            animation: fall linear infinite;
        }
        .confetti {
            position: absolute;
            top: -20px;
            width: 10px; height: 10px;
            background: #f00;
            z-index: 4000; /* Above Time Up Overlay */
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0px) rotate(0deg); }
            100% { transform: translateY(110vh) translateX(20px) rotate(360deg); }
        }

        /* --- TIMER --- */
        .timer-container {
            position: absolute;
            top: 70px;
            left: 20px; 
            background: #c0392b; 
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-radius: 12px;
            padding: 5px 15px;
            display: flex;
            flex-direction: row; 
            align-items: center; 
            gap: 10px; 
            z-index: 500;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .timer-label { font-size: 14px; font-weight: bold; text-transform: uppercase; color: #fff; margin-right: 5px; }
        .timer-display {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 32px; 
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            line-height: 1;
            margin: 0 5px;
        }
        .timer-controls { display: flex; gap: 8px; align-items: center; }
        .timer-input { width: 45px; background: #fff; border: none; color: #c0392b; font-size: 18px; text-align: center; padding: 4px; border-radius: 4px; font-weight: bold; }
        .timer-btn { background: #27ae60; border: 2px solid #fff; color: white; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; text-transform: uppercase; box-shadow: 0 3px 0 #004d00; }
        
        body.focus-mode .timer-container {
            top: 60px;
            left: 50%;
            transform: translateX(-50%) scale(1.4);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            border-color: #f1c40f;
            z-index: 1500;
        }

        /* --- SOUND TOGGLE --- */
        #soundToggle {
            position: absolute;
            top: 70px; 
            right: 20px;
            font-size: 35px;
            cursor: pointer;
            z-index: 100;
            opacity: 0.3; 
            transition: opacity 0.3s;
        }
        #soundToggle:hover { opacity: 1; filter: drop-shadow(0 0 5px rgba(255,255,255,0.8)); }

        /* --- ZOOM CONTROL --- */
        .zoom-controls { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; display: flex; align-items: center; gap: 10px; z-index: 200; font-size: 12px; color: #ccc; }
        .zoom-slider { width: 100px; cursor: pointer; }

        /* --- MAIN APP SCALER --- */
        #app-scaler {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            transform-origin: top center;
            padding-top: 160px; 
            z-index: 10;
            transition: opacity 0.5s;
        }

        h1 { font-family: 'Mountains of Christmas', cursive; font-size: 5.5vh; color: #fff; text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; margin: 0 0 5px 0; letter-spacing: 2px; line-height: 1; }
        .click-hint { font-size: 16px; color: #ffd700; margin-bottom: 10px; font-weight: normal; font-family: 'Mountains of Christmas', cursive; letter-spacing: 1px; }

        /* --- MACHINE FRAME --- */
        .slot-machine-frame { 
            background-color: #2c3e50; 
            border: 6px solid #c0392b; 
            outline: 6px dashed #fff; 
            border-radius: 30px; 
            padding: 20px; 
            display: inline-block; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            position: relative; 
            z-index: 20; 
            transition: all 0.5s ease;
        }
        
        .gold-mode-border {
            border-color: #f1c40f !important;
            box-shadow: 0 0 50px rgba(241, 196, 15, 0.6), 0 20px 50px rgba(0,0,0,0.5) !important;
            outline-color: #ffd700 !important;
        }

        /* --- EARTHQUAKE (1 SECOND) --- */
        .earthquake-shake {
            animation: aggressiveShake 1.0s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes aggressiveShake {
            10%, 90% { transform: translate3d(-4px, 0, 0) rotate(-2deg); }
            20%, 80% { transform: translate3d(6px, 0, 0) rotate(2deg); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0) rotate(-4deg); }
            40%, 60% { transform: translate3d(8px, 0, 0) rotate(4deg); }
        }

        .machine-row { display: flex; justify-content: center; align-items: center; gap: 15px; background: #000; padding: 15px; border-radius: 15px; border: 4px solid #f1c40f; }

        .reel-wrapper { position: relative; }
        .reel { width: 290px; height: 160px; background-color: #fffbf0; border: 4px solid #555; border-radius: 10px; color: #2c3e50; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; box-shadow: inset 0 10px 20px rgba(0,0,0,0.2); line-height: 1.1; }
        .reel:hover { border-color: #27ae60; }
        
        /* LABEL STYLES */
        .reel-label { 
            position: absolute; 
            top: -35px; 
            left: 50%; 
            transform: translateX(-50%); 
            color: #fff; 
            font-family: 'Mountains of Christmas', cursive; 
            font-size: 28px; 
            letter-spacing: 1px; 
            text-shadow: 2px 2px 0 #000; 
            white-space: nowrap; 
            transition: all 0.4s ease-out; 
            cursor: pointer; 
        }
        .reel-label:hover { text-shadow: 0 0 10px #ffd700; transform: translateX(-50%) scale(1.1); }

        .special-mode-label {
            color: #ffd700; 
            text-shadow: 0 0 10px #e67e22, 2px 2px 0 #000;
            font-size: 32px; 
            top: -40px;
        }
        
        .flip-animation { animation: labelFlip 0.8s ease-in-out; }
        @keyframes labelFlip {
            0% { transform: translateX(-50%) rotateX(0deg); }
            50% { transform: translateX(-50%) rotateX(360deg) scale(1.2); }
            100% { transform: translateX(-50%) rotateX(360deg) scale(1); }
        }

        .text { width: 100%; padding: 10px; pointer-events: none; }

        button.spin-btn { font-size: 26px; font-family: 'Mountains of Christmas', cursive; padding: 8px 60px; margin-top: 15px; background: linear-gradient(to bottom, #27ae60, #16a085); color: white; border: 4px solid #fff; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-shadow: 2px 2px 0 rgba(0,0,0,0.2); transition: transform 0.1s; }
        button.spin-btn:hover { transform: scale(1.05); }
        
        .save-btn { 
            font-size: 28px; 
            padding: 0 30px; 
            min-width: 120px; 
            background: #e74c3c; 
            color: #fff; 
            border: 2px solid #fff; 
            border-radius: 10px; 
            cursor: pointer; 
            height: 160px; 
            font-family: 'Mountains of Christmas', cursive; 
            box-shadow: 0 4px 0 #922b21;
            letter-spacing: 2px; 
            font-weight: bold;
        }
        .save-btn:hover { transform: translateY(3px); box-shadow: 0 1px 0 #922b21; }

        /* IDEA LOG & BUTTONS */
        .saved-wrapper { width: 90%; max-width: 1100px; background: #fff; border-radius: 15px 15px 0 0; border: 5px solid #fff; border-bottom: none; display: flex; flex-direction: column; height: 180px; margin-top: 15px; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); position: relative; }
        .saved-header { background: #c0392b; color: white; padding: 8px 20px; font-size: 20px; font-family: 'Mountains of Christmas', cursive; display: flex; justify-content: space-between; align-items: center; border-radius: 9px 9px 0 0; }
        .saved-ideas { padding: 10px 20px; color: #333; font-size: 20px; text-align: left; overflow-y: auto; flex-grow: 1; }
        .saved-ideas div { padding: 8px; border-bottom: 1px dashed #ccc; }
        .saved-entry b { color: #c0392b; }
        
        .header-buttons { display: flex; gap: 10px; }
        .clear-btn { font-size: 14px; padding: 4px 15px; background: #fff; color: #c0392b; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        /* COPY BUTTON STYLES */
        .copy-btn { font-size: 14px; padding: 4px 15px; background: #f1c40f; color: #c0392b; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .copy-btn:hover { background: #ffd700; }

        .copyright-watermark { position: absolute; bottom: 5px; right: 15px; font-size: 10px; color: #ccc; opacity: 0.6; z-index: 50; pointer-events: none; font-weight: bold; }

        .focus-mode #app-scaler { pointer-events: none; }
        #timeUpOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(192, 57, 43, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; color: white; font-family: 'Mountains of Christmas', cursive; font-size: 100px; text-shadow: 5px 5px 0 #000; animation: flashRed 0.5s infinite; }
        @keyframes flashRed { 0%, 100% { background: rgba(192, 57, 43, 0.95); } 50% { background: rgba(231, 76, 60, 0.95); } }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 50% { transform: translate(-1px, -2px) rotate(-1deg); } }

        /* --- SELECTION MENU (SANTA'S LIST) --- */
        #selectionOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 4000;
            display: none;
            align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s;
        }
        .selection-modal {
            background: #fffbf0; 
            border: 8px solid #c0392b;
            border-radius: 20px;
            width: 450px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .selection-header {
            background: #c0392b; color: #fff;
            padding: 15px; font-family: 'Mountains of Christmas', cursive; font-size: 32px;
            text-align: center; border-bottom: 4px solid #e74c3c;
            text-shadow: 2px 2px 0 #922b21;
        }
        .custom-input-wrapper {
            padding: 15px;
            border-bottom: 2px dashed #c0392b;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.03);
        }
        .custom-input {
            flex-grow: 1;
            padding: 8px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-family: 'Roboto Slab', serif;
            font-size: 16px;
        }
        .custom-btn {
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Mountains of Christmas', cursive;
            font-size: 18px;
        }
        .custom-btn:hover { background: #2ecc71; }

        .selection-list {
            overflow-y: auto; padding: 10px; flex-grow: 1;
        }
        .selection-item {
            display: block; width: 92%; margin: 8px auto;
            padding: 10px 15px;
            background: #fff; 
            border: 1px solid #e0d0b0;
            border-radius: 8px;
            color: #5d4037; 
            font-family: 'Mountains of Christmas', cursive;
            font-size: 24px; 
            cursor: pointer; transition: all 0.2s;
            text-align: left;
        }
        .selection-item:hover { 
            background: #27ae60; 
            color: #fff; 
            border-color: #27ae60; 
            transform: scale(1.02); 
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .close-selection {
            padding: 12px; background: #333; color: white; border: none; font-weight: bold; cursor: pointer;
            font-family: 'Roboto Slab', serif; letter-spacing: 1px;
            border-radius: 0 0 12px 12px;
        }
        .selection-list::-webkit-scrollbar { width: 16px; }
        .selection-list::-webkit-scrollbar-track { background: #fff; border-left: 1px solid #ddd; }
        .selection-list::-webkit-scrollbar-thumb { 
            background-image: repeating-linear-gradient(45deg, #c0392b 0, #c0392b 10px, #ffffff 10px, #ffffff 20px);
            border-radius: 8px;
            border: 2px solid #fff;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

    </style>
</head>
<body>

    <ul class="light-rope">
        <li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li><li class="light"></li>
    </ul>

    <div id="timeUpOverlay">
        <div>TIME'S UP!</div>
        <button class="clear-btn" onclick="closeOverlay()" style="font-size:30px; margin-top:30px; padding:10px 40px;">OKAY</button>
    </div>
    
    <div id="confetti-container"></div>

    <div id="selectionOverlay" onclick="closeSelectionMenu(event)">
        <div class="selection-modal" id="selectionModal">
            <div class="selection-header" id="menuTitle">Select Option</div>
            <div class="custom-input-wrapper">
                <input type="text" id="customInput" class="custom-input" placeholder="Type your own idea..." onkeypress="handleEnter(event)">
                <button class="custom-btn" onclick="submitCustomOption()">USE</button>
            </div>
            <div class="selection-list" id="menuList"></div>
            <button class="close-selection" onclick="closeSelectionMenu(null, true)">CANCEL</button>
        </div>
    </div>

    <div id="snow-container"></div>

    <div class="timer-container" id="mainTimer">
        <span class="timer-label">Timer:</span>
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div class="timer-controls">
            <input type="number" id="timeInput" class="timer-input" value="10" min="0.1" max="60" step="0.1">
            <button class="timer-btn" onclick="toggleTimer()" id="timerBtn">START</button>
        </div>
    </div>

    <div id="soundToggle" onclick="toggleSound()">🔊</div>

    <div class="zoom-controls">
        <span>Zoom:</span>
        <input type="range" min="0.6" max="1.4" step="0.1" value="1" class="zoom-slider" oninput="setZoom(this.value)">
    </div>

    <div id="app-scaler">
        <h1>🎄 Quick Write Generator 🎄</h1>
        <div class="click-hint">Click the Labels (e.g., "Character") to select from list!</div>
        
        <div class="slot-machine-frame" id="machineFrame">
            <div class="machine-row">
                <div class="reel-wrapper">
                    <div class="reel-label" id="label1" onclick="openSelectionMenu(1)">Writing Form</div>
                    <div class="reel" id="reel1" onclick="spinIndividual(1)"><div class="text">A Diary Entry</div></div>
                </div>
                <div class="reel-wrapper">
                    <div class="reel-label" id="label2" onclick="openSelectionMenu(2)">Character</div>
                    <div class="reel" id="reel2" onclick="spinIndividual(2)"><div class="text">The Grinch</div></div>
                </div>
                <div class="reel-wrapper">
                    <div class="reel-label" id="label3" onclick="openSelectionMenu(3)">Setting</div>
                    <div class="reel" id="reel3" onclick="spinIndividual(3)"><div class="text">Stuck in a Chimney</div></div>
                </div>
                <button class="save-btn" onclick="savePrompt()">SAVE</button>
            </div>
            <button class="spin-btn" onclick="spinAll()">SPIN ALL</button>
        </div>

        <div class="saved-wrapper">
            <div class="saved-header">
                <span>📝 Writing Tasks</span>
                <div class="header-buttons">
                    <button class="copy-btn" id="copyBtn" onclick="copySavedIdeas()">📋 Copy All</button>
                    <button class="clear-btn" onclick="clearIdeas()">Clear List</button>
                </div>
            </div>
            <div class="saved-ideas" id="savedIdeas"></div>
            <div class="copyright-watermark">© Ink and Interface</div>
        </div>
    </div>

    <script>
        // --- DATA ---
        const standardData = {
            1: ["A Diary Entry", "A Persuasive Letter To...", "How-To Instructions For...", "A Five Senses Description of...", "A 'Wanted' Poster For...", "A To-Do List For...", "A Rhyming Poem About...", "A News Report On...", "Rules For...", "A Postcard To...", "A Packing List For...", "A Prediction About...", "A Thank You Note To...", "A Friendly Letter To...", "An Interview With..."],
            2: ["Santa Claus", "Mrs. Claus", "The Grinch", "Frosty the Snowman", "Buddy the Elf", "Rudolph", "Dasher", "Blitzen", "Sven (Frozen)", "Olaf", "A Minecraft Creeper", "Snoopy", "A Minion Elf", "The Gingerbread Man", "Pikachu", "A Reindeer in Training", "Elsa", "Baby Yoda", "Kevin (Home Alone)", "A Polar Bear", "A Puppy", "A Penguin", "A Grumpy Cat", "A Snowy Owl"],
            3: ["In the Toy Workshop", "Inside a Snow Globe", "Stuck in a Chimney", "In a Gingerbread House", "On Santa's Sleigh", "Under the Christmas Tree", "At the North Pole", "In a Hot Cocoa Shop", "On a Snowy Roof", "In a Candy Cane Forest", "In a Pile of Snow", "At a Holiday Party", "On a Frozen Pond", "In a Giant Stocking", "At the Reindeer Barn"]
        };
        const howToTasks = ["Decorating a Cactus", "Catching a Reindeer", "Untangling Lights", "Wrapping a Cat", "Eating 100 Cookies", "Flying a Sleigh", "Hiding from Santa", "Baking Coal", "Surviving Christmas", "Building a Snow Fort", "Training a Puppy", "Ruining Dinner", "Waking up a Bear"];

        let activeData = { 
            1: [...standardData[1]], 
            2: [...standardData[2]], 
            3: [...standardData[3]] 
        };
        const spinHistory = { 1: [], 2: [], 3: [] }; const HISTORY_LIMIT = 5;
        let spinTimers = { 1: null, 2: null, 3: null };
        let isSpinningAll = false;
        let currentMenuReelID = 0; 

        // --- AUDIO ---
        let audioCtx; let isMuted = false;
        function toggleSound() { isMuted = !isMuted; const btn = document.getElementById("soundToggle"); btn.innerText = isMuted ? "🔇" : "🔊"; btn.style.opacity = isMuted ? "0.3" : "1"; if(isMuted && audioCtx) audioCtx.suspend(); if(!isMuted && audioCtx) audioCtx.resume(); }
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended' && !isMuted) audioCtx.resume(); }

        function playSound(type) {
            if (isMuted) return; initAudio(); const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            
            if (type === 'tick') {
                osc.type = 'triangle'; osc.frequency.value = 200; 
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'ding') {
                osc.type = 'sine'; osc.frequency.value = 523; 
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'magic') {
                const notes = [1046, 1318, 1568, 2093]; 
                notes.forEach((freq, i) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.type = 'sine'; o.frequency.value = freq;
                    const s = now + (i * 0.08);
                    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.1, s + 0.05); g.gain.exponentialRampToValueAtTime(0.001, s + 0.6);
                    o.connect(g); g.connect(audioCtx.destination); o.start(s); o.stop(s + 0.6);
                });
                return; 
            } else if (type === 'sleigh') {
                for (let i = 0; i < 5; i++) {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.frequency.value = 2000 + Math.random() * 3000; o.type = 'triangle'; 
                    const s = now + (i * 0.05); 
                    g.gain.setValueAtTime(0.1, s); g.gain.exponentialRampToValueAtTime(0.001, s + 0.3); 
                    o.connect(g); g.connect(audioCtx.destination); o.start(s); o.stop(s + 0.3);
                }
                return;
            }
            osc.connect(gain); gain.connect(audioCtx.destination);
        }

        // --- VISUALS ---
        function createSnow() {
            const container = document.getElementById('snow-container');
            for (let i = 0; i < 40; i++) {
                let flake = document.createElement('div');
                flake.className = 'snowflake'; flake.innerHTML = '❄';
                flake.style.left = Math.random() * 100 + 'vw';
                flake.style.animationDuration = (Math.random() * 3 + 4) + 's'; 
                flake.style.fontSize = (Math.random() * 15 + 10) + 'px';
                container.appendChild(flake);
            }
        }
        createSnow();
        function setZoom(val) { document.getElementById('app-scaler').style.transform = `scale(${val})`; }

        // --- CONFETTI LOGIC ---
        function fireConfetti() {
            const colors = ['#f00', '#0f0', '#ffd700', '#00f', '#fff'];
            const container = document.getElementById('confetti-container');
            container.innerHTML = ''; // Clear previous
            
            for (let i = 0; i < 100; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.background = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 1) + 's'; 
                conf.style.width = (Math.random() * 10 + 5) + 'px';
                conf.style.height = (Math.random() * 10 + 5) + 'px';
                container.appendChild(conf);
            }
            
            // Clean up
            setTimeout(() => { container.innerHTML = ''; }, 3000);
        }

        // --- MENU LOGIC ---
        function openSelectionMenu(reelID) {
            currentMenuReelID = reelID;
            const overlay = document.getElementById('selectionOverlay');
            const modal = document.getElementById('selectionModal');
            const list = document.getElementById('menuList');
            const title = document.getElementById('menuTitle');
            const input = document.getElementById('customInput');

            input.value = "";
            list.innerHTML = "";
            
            const currentItems = activeData[reelID];
            title.innerText = document.getElementById(`label${reelID}`).innerText;

            currentItems.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'selection-item';
                btn.innerText = item;
                btn.onclick = () => selectItem(reelID, item);
                list.appendChild(btn);
            });

            overlay.style.display = "flex";
            setTimeout(() => { overlay.style.opacity = 1; modal.style.transform = "scale(1)"; input.focus(); }, 10);
        }

        function closeSelectionMenu(e, force = false) {
            if (force || e.target.id === 'selectionOverlay') {
                const overlay = document.getElementById('selectionOverlay');
                const modal = document.getElementById('selectionModal');
                overlay.style.opacity = 0; modal.style.transform = "scale(0.8)";
                setTimeout(() => { overlay.style.display = "none"; }, 300);
            }
        }

        function handleEnter(e) { if (e.key === 'Enter') submitCustomOption(); }
        function submitCustomOption() {
            const input = document.getElementById('customInput');
            const val = input.value.trim();
            if(val) selectItem(currentMenuReelID, val);
        }

        function selectItem(id, text) {
            const reel = document.getElementById(`reel${id}`);
            reel.querySelector('.text').innerText = text;
            closeSelectionMenu(null, true);
            playSound('ding');

            if (id === 1) {
                if (text === "How-To Instructions For...") triggerEarthquakeMode();
                else resetMode();
            }
        }

        // --- COPY LOGIC ---
        function copySavedIdeas() {
            const container = document.getElementById('savedIdeas');
            if (container.children.length === 0) return;

            let textToCopy = "";
            // Strip HTML and format
            for (let child of container.children) {
                textToCopy += child.innerText + "\n";
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.innerText;
                btn.innerText = "✅ Copied!";
                btn.style.background = "#27ae60";
                btn.style.color = "#fff";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = "#f1c40f";
                    btn.style.color = "#c0392b";
                }, 2000);
            });
        }

        // --- TIMER ---
        let timerInterval = null;
        function toggleTimer() { if(timerInterval) stopTimer(); else startTimer(); }
        function startTimer() {
            const input = document.getElementById("timeInput");
            let mins = parseFloat(input.value); if(!mins || mins <= 0) return;
            clearInterval(timerInterval);
            document.body.classList.add("focus-mode"); document.getElementById("timeUpOverlay").style.display = "none"; document.body.classList.remove("shake");
            let seconds = Math.floor(mins * 60); updateDisplay(seconds);
            document.getElementById("timerBtn").innerText = "STOP"; document.getElementById("timerBtn").style.background = "#c0392b";
            playSound('ding');
            timerInterval = setInterval(() => { seconds--; updateDisplay(seconds); if(seconds <= 0) { stopTimer(true); triggerTimeUp(); } }, 1000);
        }
        function stopTimer(finished = false) {
            clearInterval(timerInterval); timerInterval = null;
            document.body.classList.remove("focus-mode");
            const btn = document.getElementById("timerBtn"); btn.innerText = "START"; btn.style.background = "#27ae60";
            if(!finished) { playSound('ding'); document.getElementById("timeInput").value = 10; }
        }
        function updateDisplay(s) { let m = Math.floor(s / 60); let sec = s % 60; document.getElementById("timerDisplay").innerText = `${m}:${sec < 10 ? '0' : ''}${sec}`; }
        
        function triggerTimeUp() {
            document.getElementById("timeUpOverlay").style.display = "flex"; 
            document.body.classList.add("shake");
            fireConfetti(); // FIRE CONFETTI
            let count = 0; const bellInterval = setInterval(() => { playSound('sleigh'); count++; if(count >= 3) clearInterval(bellInterval); }, 600);
        }
        function closeOverlay() { document.getElementById("timeUpOverlay").style.display = "none"; document.body.classList.remove("shake"); document.getElementById("timeInput").value = 10; }

        // --- SPIN LOGIC ---
        function startVisualSpin(id, speed = 60) {
            if (spinTimers[id]) clearInterval(spinTimers[id]);
            const reel = document.getElementById(`reel${id}`);
            const textDiv = reel.querySelector('.text');
            reel.classList.add('spinning');
            spinTimers[id] = setInterval(() => {
                const currentList = activeData[id];
                textDiv.innerText = currentList[Math.floor(Math.random() * currentList.length)];
                if(Math.random() > 0.8) playSound('tick');
            }, speed);
        }

        function lockReel(id) {
            if (spinTimers[id]) clearInterval(spinTimers[id]);
            const reel = document.getElementById(`reel${id}`);
            const textDiv = reel.querySelector('.text');
            reel.classList.remove('spinning');
            
            const list = activeData[id];
            let finalItem; let attempts = 0;
            do { finalItem = list[Math.floor(Math.random() * list.length)]; attempts++; } 
            while (spinHistory[id].includes(finalItem) && attempts < 15);

            spinHistory[id].push(finalItem);
            if (spinHistory[id].length > HISTORY_LIMIT) spinHistory[id].shift();

            textDiv.innerText = finalItem;
            reel.classList.add('locked'); setTimeout(() => reel.classList.remove('locked'), 400); 
            playSound('ding');
            return finalItem;
        }

        function spinAll() { 
            if(isSpinningAll || timerInterval) return; 
            isSpinningAll = true;

            resetMode();
            startVisualSpin(1); startVisualSpin(2); startVisualSpin(3);
            
            setTimeout(() => {
                const result1 = lockReel(1);
                if (result1 === "How-To Instructions For...") {
                    triggerEarthquakeMode(); 
                } else {
                    setTimeout(() => lockReel(2), 800);
                    setTimeout(() => { lockReel(3); isSpinningAll = false; }, 1600);
                }
            }, 1000);
        }

        function triggerEarthquakeMode() {
            playSound('magic');
            const frame = document.getElementById('machineFrame');
            frame.classList.add('earthquake-shake', 'gold-mode-border');

            clearInterval(spinTimers[2]); clearInterval(spinTimers[3]);
            
            activeData[2] = howToTasks;
            activeData[3] = standardData[2];

            const l2 = document.getElementById('label2');
            const l3 = document.getElementById('label3');
            l2.classList.add('flip-animation'); l3.classList.add('flip-animation');
            setTimeout(() => {
                l2.innerText = "The Task"; l2.classList.add("special-mode-label");
                l3.innerText = "The Author"; l3.classList.add("special-mode-label");
            }, 300);

            setTimeout(() => { startVisualSpin(2, 30); startVisualSpin(3, 30); }, 100);
            setTimeout(() => { lockReel(2); }, 1100); 
            setTimeout(() => { lockReel(3); isSpinningAll = false; frame.classList.remove('earthquake-shake'); }, 1900);
        }

        function resetMode() {
            activeData[2] = standardData[2];
            activeData[3] = standardData[3];
            document.getElementById('machineFrame').classList.remove('gold-mode-border', 'earthquake-shake');
            const l2 = document.getElementById('label2');
            const l3 = document.getElementById('label3');
            l2.innerText = "Character"; l2.classList.remove("special-mode-label", "flip-animation");
            l3.innerText = "Setting"; l3.classList.remove("special-mode-label", "flip-animation");
        }

        function spinIndividual(id) {
            if(isSpinningAll) return;
            startVisualSpin(id);
            setTimeout(() => {
                const res = lockReel(id);
                if (id === 1) {
                    if (res === "How-To Instructions For...") triggerEarthquakeMode();
                    else resetMode();
                }
            }, 800);
        }

        function savePrompt() { 
            const f = document.querySelector('#reel1 .text').innerText; 
            const c = document.querySelector('#reel2 .text').innerText; 
            const s = document.querySelector('#reel3 .text').innerText; 
            let prompt = "";
            if (f === "How-To Instructions For...") {
                prompt = `Write <b>${f}</b> <b>${c}</b> from <b>${s}</b>.`;
            } else {
                prompt = `Write <b>${f}</b> from <b>${c}</b> who is <b>${s}</b>.`;
            }
            const box = document.getElementById('savedIdeas'); 
            const newDiv = document.createElement('div'); 
            newDiv.className = 'saved-entry'; 
            newDiv.innerHTML = prompt; 
            box.prepend(newDiv); 
        }
        function clearIdeas() { document.getElementById('savedIdeas').innerHTML = ""; }
    </script>
</body>
</html>
